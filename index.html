<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出世魚ゲーム 〜板前サバイバル〜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0f172a;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 420 / 700;
            max-height: 78vh;
            background: linear-gradient(to bottom, #dbeafe, #bae6fd, #7dd3fc);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            margin: 0 auto;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .text-outline {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 4px 4px rgba(0,0,0,0.3);
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }
        /* サメのアニメーション */
        @keyframes swimShark {
            0% { right: -80px; transform: scaleX(-1) translateY(0) rotate(0deg); }
            25% { transform: scaleX(-1) translateY(-15px) rotate(-5deg); }
            50% { transform: scaleX(-1) translateY(10px) rotate(5deg); }
            75% { transform: scaleX(-1) translateY(-10px) rotate(-3deg); }
            100% { right: 480px; transform: scaleX(-1) translateY(0) rotate(0deg); }
        }
        @keyframes bite {
            0%, 100% { transform: scaleX(-1) rotate(0deg); }
            50% { transform: scaleX(-1) rotate(-15deg); }
        }
        .shark-anim {
            position: absolute;
            top: 40%;
            font-size: 64px;
            animation: swimShark 1.5s linear forwards, bite 0.25s ease-in-out infinite;
            z-index: 25;
            pointer-events: none;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] m-0 overflow-hidden text-slate-800">

    <header class="bg-gradient-to-r from-cyan-700 to-blue-900 text-white p-2 sm:p-3 shadow-lg relative z-20 border-b-4 border-yellow-400 flex-shrink-0 flex justify-between items-center px-4">
        <h1 class="text-lg sm:text-xl font-black tracking-wider text-outline flex-1">
            出世魚 <span class="text-yellow-300">〜板前〜</span>
        </h1>
        <div class="bg-black/30 px-3 py-1 rounded-full border border-blue-400/50 flex items-baseline gap-1 shrink-0">
            <span class="text-[10px] sm:text-xs text-blue-200 font-bold">売上</span>
            <span class="text-xl sm:text-2xl font-black text-yellow-400 drop-shadow-md" id="scoreDisplay">0</span>
        </div>
    </header>

    <main class="flex-1 w-full flex flex-col items-center justify-center p-2 sm:p-4 bg-slate-900 overflow-hidden relative">
        <div id="canvas-wrapper">
            <!-- スタート画面（表紙） - 改修箇所1, 2 -->
            <div id="startScreen" class="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center text-white z-40 backdrop-blur-md p-6 text-center">
                <h2 class="text-3xl sm:text-4xl font-black text-yellow-400 mb-2 text-outline">出世魚ゲーム</h2>
                <p class="text-sm font-bold text-blue-300 mb-6">〜板前サバイバル〜</p>
                
                <!-- 遊び方の文字サイズを大きく変更 (text-xs -> text-sm) -->
                <div class="bg-blue-950/80 border-2 border-blue-400/50 rounded-xl p-4 text-left mb-8 max-w-xs text-sm space-y-2 shadow-xl">
                    <p class="font-bold text-yellow-300 mb-1">🎣 遊び方:</p>
                    <p>・魚を落として同じ種類同士をくっつけて出世させよう！</p>
                    <p>・上のご注文通りに魚を揃えて出荷（スコア獲得）！</p>
                    <p>・いけすの上のラインを超えた状態が続くとゲームオーバー。</p>
                </div>

                <button id="startBtn" class="px-8 py-4 bg-gradient-to-r from-green-400 to-emerald-600 text-white rounded-full font-black text-xl hover:scale-105 active:scale-95 transition-transform shadow-[0_0_15px_rgba(52,211,153,0.5)] text-outline">
                    ゲームスタート
                </button>
            </div>

            <!-- 上部UI (ゲーム中のみ表示されるように配置を整理) -->
            <div class="absolute top-2 left-2 right-2 flex justify-between z-10 pointer-events-none opacity-0 transition-opacity duration-500" id="gameUIHeader">
                <div id="missionBoard" class="w-[140px] bg-white/95 backdrop-blur-sm rounded-lg p-1.5 shadow-lg flex flex-col justify-between border-2 border-orange-500 pointer-events-auto origin-top-left">
                    <p class="text-[9px] text-orange-600 font-bold leading-none mb-0.5">📝 ご注文</p>
                    <p class="text-xs font-black text-slate-800 leading-tight truncate" id="missionTitle">🍗 ツバス唐揚</p>
                    <p class="font-black text-blue-700 text-[10px] leading-none mt-1" id="missionReq">👉 ツバス 2匹</p>
                </div>

                <div class="w-[50px] h-[54px] bg-white/95 backdrop-blur-sm rounded-lg shadow-lg border-2 border-blue-400 flex flex-col items-center justify-start pointer-events-auto shrink-0 relative overflow-hidden">
                    <p class="text-[9px] text-blue-800 font-bold mt-0.5 z-10 leading-none">NEXT</p>
                    <canvas id="nextCanvas" width="50" height="40" class="absolute bottom-0 w-full h-[40px]"></canvas>
                </div>
            </div>

            <canvas id="gameCanvas" width="420" height="700"></canvas>

            <!-- ゲームオーバーUI -->
            <div id="gameOverUI" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-white z-30 backdrop-blur-sm">
                <h2 class="text-5xl font-black text-red-500 mb-2 text-outline">閉店！</h2>
                <p class="text-lg mb-6 font-bold">いけすが溢れました</p>
                <div class="bg-blue-900/80 border-2 border-blue-400 rounded-xl p-6 text-center mb-8 shadow-2xl backdrop-blur-md">
                    <p class="text-gray-300 text-lg mb-1">最終売上スコア</p>
                    <p class="text-6xl font-black text-yellow-400 text-outline" id="finalScore">0</p>
                </div>
                <button id="retryBtn" class="px-8 py-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-white rounded-full font-bold text-xl hover:scale-105 active:scale-95 transition-transform shadow-[0_0_15px_rgba(250,204,21,0.5)] text-outline">
                    もう一度仕入れる
                </button>
            </div>
        </div>

        <!-- ゲーム画面下のボタン＆説明エリア (ゲーム中のみ表示) - 改修箇所2 -->
        <div class="w-full max-w-[420px] flex items-center justify-between mt-2 px-1 gap-2 opacity-0 transition-opacity duration-500" id="gameUIFooter">
            <button id="sharkBtn" onclick="callShark()" class="px-3 py-2 bg-gradient-to-r from-red-500 to-pink-600 text-white rounded-xl font-black text-xs shadow-lg hover:scale-105 active:scale-95 transition-transform text-outline border-2 border-white/80 shrink-0">
                🦈 サメ出動 (あと1回)
            </button>
            <div class="text-slate-400 text-[10px] sm:text-xs text-right leading-tight">
                <span class="text-pink-400 font-bold">🦈 サメで魚を全消し！(1回限定)</span><br>
                🐟注文揃えて出荷 🐡🪼は🪝で消す
            </div>
        </div>
    </main>

    <script>
        const Engine = Matter.Engine,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events,
              Body = Matter.Body;

        const CANVAS_WIDTH = 420;
        const CANVAS_HEIGHT = 700;
        const DEAD_LINE_Y = 110;

        const FISH_TYPES = [
            { level: 0, name: '卵',       radius: 16,  color: '#FEF08A' },
            { level: 1, name: 'モジャコ', radius: 24,  color: '#A7F3D0' },
            { level: 2, name: 'ワカシ',   radius: 34,  color: '#6EE7B7' },
            { level: 3, name: 'ツバス',   radius: 46,  color: '#67E8F9' },
            { level: 4, name: 'イナダ',   radius: 60,  color: '#38BDF8' },
            { level: 5, name: 'ハマチ',   radius: 76,  color: '#60A5FA' },
            { level: 6, name: 'ワラサ',   radius: 94,  color: '#818CF8' },
            { level: 7, name: 'メジロ',   radius: 114, color: '#A78BFA' },
            { level: 8, name: 'ブリ',     radius: 136, color: '#F472B6' },
            { level: 9, name: '寒ブリ',   radius: 160, color: '#0284C7' },
            { level: 10, name: '竜宮ブリ', radius: 190, color: '#F59E0B' }
        ];

        const EVOLUTION_POINTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 100];

        const MISSIONS = [
            { title: "ツバス唐揚", targetLevel: 3, count: 3, icon: "🍗", reward: 100 },
            { title: "イナダカルパッチョ", targetLevel: 4, count: 2, icon: "🥗", reward: 150 },
            { title: "ハマチ握り", targetLevel: 5, count: 2, icon: "🍣", reward: 250 },
            { title: "ワラサ照焼", targetLevel: 6, count: 2, icon: "🍱", reward: 400 },
            { title: "メジロ造り", targetLevel: 7, count: 1, icon: "🐟", reward: 500 },
            { title: "特上ブリ大根", targetLevel: 8, count: 2, icon: "🍲", reward: 1000 }
        ];

        let engine, world, runner;
        let canvas, ctx;
        let nextCtx;
        let score = 0, isGameOver = false, gameOverTimer = 0;
        let nextItem = null, nextNextItem = null;
        let canDrop = false, isDragging = false, dropX = CANVAS_WIDTH / 2;
        let bodiesToRemove = [], bodiesToAdd = [];
        let currentMissionIndex = 0;
        let timeTick = 0;
        let isMissionAnimating = false;
        let canUseShark = true;

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            const nextCanvasEl = document.getElementById('nextCanvas');
            if(nextCanvasEl) nextCtx = nextCanvasEl.getContext('2d');

            engine = Engine.create();
            world = engine.world;
            engine.gravity.y = 1.2;

            const wallOpt = { isStatic: true, label: "Wall", friction: 0.5, restitution: 0.1 };
            const floor = Bodies.rectangle(CANVAS_WIDTH/2, CANVAS_HEIGHT+30, CANVAS_WIDTH+100, 60, wallOpt);
            const leftWall = Bodies.rectangle(-30, CANVAS_HEIGHT/2, 60, CANVAS_HEIGHT*2, wallOpt);
            const rightWall = Bodies.rectangle(CANVAS_WIDTH+30, CANVAS_HEIGHT/2, 60, CANVAS_HEIGHT*2, wallOpt);
            Matter.World.add(world, [floor, leftWall, rightWall]);

            nextItem = getRandomItem();
            nextNextItem = getRandomItem();
            updateMissionUI();
            setupInputEvents();
            setupPhysicsEvents();

            runner = Runner.create();
            Runner.run(runner, engine);
            requestAnimationFrame(draw);

            document.getElementById('retryBtn').addEventListener('click', restartGame);
        }

        function callShark() {
            if (!canUseShark || isGameOver) return;
            canUseShark = false;
            const btn = document.getElementById('sharkBtn');
            if (btn) {
                btn.innerText = "🦈 出動中…";
                btn.style.background = "#64748b";
                btn.style.cursor = "not-allowed";
            }

            const wrapper = document.getElementById('canvas-wrapper');
            const sharkEl = document.createElement('div');
            sharkEl.innerHTML = "🦈";
            sharkEl.className
